# Blueprint do Render: cria o banco PostgreSQL gratuito e a API, já conectados entre si.
# Uso: Render Dashboard -> Blueprints -> New Blueprint Instance -> escolher este repositório.
databases:
  - name: conecta-escola-db
    plan: free
    region: virginia
    databaseName: conecta_escola
    user: conecta
    ipAllowList: [] # apenas conexões internas do Render (sem acesso externo ao banco)

services:
  - type: web
    name: conecta-escola-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: conecta-escola-db
          property: connectionString
